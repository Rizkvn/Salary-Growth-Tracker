services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salary_tracker_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_PASSWORD: "${APP_PASSWORD:?Error: APP_PASSWORD is not set. Please create a .env file from .env.example}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET is not set. Please create a .env file from .env.example}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      DATABASE_URL: "sqlite:////app/data/salary_tracker.db"
    volumes:
      - sqlite_data:/app/data
    networks:
      - salary_tracker_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    container_name: salary_tracker_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salary_tracker_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sqlite_data:
    name: salary_tracker_sqlite_data

networks:
  salary_tracker_network:
    name: salary_tracker_network
    driver: bridge
